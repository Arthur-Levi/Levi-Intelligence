services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: levi_intelligence
      POSTGRES_USER: levi
      POSTGRES_PASSWORD: levi_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - levi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levi -d levi_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: levi_intelligence_test
      POSTGRES_USER: levi_test
      POSTGRES_PASSWORD: levi_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levi_test -d levi_intelligence_test"]
      interval: 3s
      timeout: 3s
      retries: 15
  discovery-worker:
    build:
      context: ./backend
    profiles: ["workers"]
    command: ["python", "-m", "app.workers.discovery"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://levi:levi_local_only@postgres:5432/levi_intelligence
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  crawler-worker:
    build:
      context: ./backend
    profiles: ["workers"]
    command: ["python", "-m", "app.workers.crawler"]
    environment:
      CRAWLER_DATABASE_URL: ${CRAWLER_DATABASE_URL:?Set a dedicated development crawler database URL}
      CRAWLER_WORKER_CONCURRENCY: "2"
      CRAWLER_DB_POOL_SIZE: "2"
      CRAWLER_DB_MAX_OVERFLOW: "0"
      CRAWLER_DB_POOL_TIMEOUT_SECONDS: "2"
      CRAWLER_DB_CONNECT_TIMEOUT_SECONDS: "3"
      CRAWLER_POLL_SECONDS: "1"
      CRAWLER_ATTEMPT_SECONDS: "60"
      CRAWLER_CANCELLATION_SECONDS: "5"
      CRAWLER_SHUTDOWN_GRACE_SECONDS: "15"
      CRAWLER_SHUTDOWN_CLEANUP_SECONDS: "5"
      CRAWLER_CONTAINER_STOP_GRACE_SECONDS: ${CRAWLER_CONTAINER_STOP_GRACE_SECONDS:-30}
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: ${CRAWLER_CONTAINER_STOP_GRACE_SECONDS:-30}s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - levi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  levi_postgres_data:
  levi_redis_data:
