name: Crawler synthetic capacity
on:
  workflow_dispatch:
    inputs:
      size:
        description: Synthetic queued jobs (bounded)
        type: choice
        options: ['100', '500', '1000']
        default: '100'
      workers:
        description: Local synthetic workers
        type: choice
        options: ['1', '2', '4', '8']
        default: '2'
      repetition:
        description: Matrix repetition label (run each worker count three times)
        type: choice
        options: ['1', '2', '3']
        default: '1'
      revision:
        description: Exact feature-branch commit SHA for a reproducible matrix
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: crawler-capacity-disposable
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.12-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: levi_gate_1b1_ci
          POSTGRES_USER: levi_gate_1b1_ci
          POSTGRES_PASSWORD: ephemeral_ci_only_password
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=512m
          --health-cmd "pg_isready -U levi_gate_1b1_ci -d levi_gate_1b1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://levi_gate_1b1_ci:ephemeral_ci_only_password@postgres:5432/levi_gate_1b1_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - run: pip install -e '.[dev]'
      - name: Verify disposable PostgreSQL identity
        run: python scripts/postgres_ci.py preflight
      - name: Apply migrations and verify schema
        run: python scripts/postgres_ci.py migrate-and-verify
      - name: Run bounded synthetic benchmark
        run: python -m scripts.crawler_capacity --size "${{ inputs.size }}" --workers "${{ inputs.workers }}" --seconds 600 --output capacity-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawler-capacity-w${{ inputs.workers }}-r${{ inputs.repetition }}-${{ github.run_id }}
          path: backend/capacity-report.json
          if-no-files-found: warn
          retention-days: 7
