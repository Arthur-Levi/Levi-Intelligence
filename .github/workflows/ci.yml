name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: pytest -q --ignore=tests/integration
  postgres-integration:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: levi_gate_1b1_ci
          POSTGRES_USER: levi_gate_1b1_ci
          POSTGRES_PASSWORD: ephemeral_ci_only_password
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=512m
          --health-cmd "pg_isready -U levi_gate_1b1_ci -d levi_gate_1b1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://levi_gate_1b1_ci:ephemeral_ci_only_password@postgres:5432/levi_gate_1b1_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e '.[dev]'
      - name: Verify PostgreSQL test identity
        run: python scripts/postgres_ci.py preflight
      - name: Apply migrations and verify crawler schema
        run: python scripts/postgres_ci.py migrate-and-verify
      - name: Run PostgreSQL integration tests
        run: pytest -q tests/integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
